; N34-derived board target. Pin the framework and published host library.
[env:m5stack-core-esp32]
platform = espressif32@6.9.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/m5stack/M5Stack.git#f72d90d261384afe52859f4477484b8c3e98237c
    adafruit/RTClib@2.1.3
    adafruit/Adafruit BNO055@1.6.3
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
    https://github.com/bakemocho/m2-absolute-encoder-i2c-host.git#73d6df16cf9bb8336d8cef991799e35eaf54aee7
build_flags =
    -D N36_ENABLE_MOTOR=0
    -D N36_ALIGNMENT_CONFIRMED=0
    -D N36_ENCODER_OFFSET_DEG=0.0f
; GPIO 5, 100 Hz, 8 bit duty=16 are inherited from N34. Confirm wiring and
; direction before changing the two flags. Never upload to hardware as a test.
